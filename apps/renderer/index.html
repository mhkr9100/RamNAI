<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' * ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:*; img-src 'self' data: https:; frame-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Workspace</title>
    <script>
      (() => {
        try {
          const STORAGE_KEY = 'workspace-theme';
          const LEGACY_STORAGE_KEY = 'theme';
          const stored = localStorage.getItem(STORAGE_KEY);
          const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
          const preference = stored === 'light' || stored === 'dark' || stored === 'system'
            ? stored
            : legacy === 'light' || legacy === 'dark'
              ? legacy
              : 'dark';
          const resolved = preference === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          const root = document.documentElement;
          root.classList.toggle('dark', resolved === 'dark');
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
          localStorage.setItem(LEGACY_STORAGE_KEY, resolved);
        } catch {
          // Theme boot is best-effort only.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-shell-50 text-slate-900 dark:bg-surface-0 dark:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
